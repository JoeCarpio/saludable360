<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Huntsman Saludable 360</title>
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%230f766e'/><text x='50' y='64' font-size='38' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>360</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --brand:#0f766e; --brand-2:#14b8a6; --brand-soft:#e6f4f2;
  --bg:#f3f5f4; --card:#ffffff; --ink:#0b0b0b; --ink-2:#3f3f3c; --muted:#6b6a66; --line:#e3e6e4;
  --ok:#15803d; --ok-soft:#e7f5ec; --warn:#a16207; --warn-soft:#fdf4dc; --bad:#b91c1c; --bad-soft:#fdecec;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --gold:#c99700; --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h2{font-size:20px;margin:0}
h3{font-size:17px;margin:0 0 10px}
small,.muted{color:var(--muted)}
/* ---------- header / nav ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:13px}
.brandLogo{flex:none;height:40px;max-width:130px;object-fit:contain;background:#fff;border-radius:10px;padding:5px 8px}
@media (max-width:420px){.brandLogo{height:34px;max-width:96px;padding:4px 6px}}
.brand b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:#d5efeb;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
.userChip{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:25}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;text-decoration:none;color:var(--muted);font-size:12px;cursor:pointer;border-bottom:3px solid transparent;user-select:none}
.tabs a .ic{font-size:19px;line-height:1}
.tabs a.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
@media (max-width:720px){
  .tabs{position:fixed;bottom:0;top:auto;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  .tabs a{border-bottom:0;border-top:3px solid transparent}
  .tabs a.on{border-top-color:var(--brand)}
  main{padding-bottom:90px!important}
}
main{max-width:1100px;margin:0 auto;padding:16px}
.narrow{max-width:640px;margin:0 auto}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c9cfcc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0c5f59}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:#f0b8b8;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
label.fld{display:block;margin:0 0 12px}
label.fld>span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid #cfd5d2;border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
textarea{min-height:80px;resize:vertical}
.pin{letter-spacing:10px;text-align:center;font-size:22px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eef0ef;color:var(--ink-2);white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.notice{background:var(--warn-soft);color:#6b4a06;border:1px solid #f1dfae;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.notice.info{background:var(--brand-soft);color:#0b4f4a;border-color:#bfe3de}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
/* ---------- feed ---------- */
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.post .ph{display:flex;gap:10px;align-items:center;padding:12px 14px}
.post .ph .who b{display:block}
.post .ph .who small{font-size:12px}
.post .act{padding:0 14px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.actTag{font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px;background:var(--brand-soft);color:var(--brand)}
.ptsTag{font-weight:800;font-size:13px;padding:4px 10px;border-radius:8px;background:#fff7e0;color:#8a6400}
.media{display:grid;gap:2px;background:#000}
.media.n2{grid-template-columns:1fr 1fr}
.media.n3{grid-template-columns:1fr 1fr}
.media.n3>*:first-child{grid-column:1/3}
.media img,.media video{width:100%;display:block;max-height:520px;object-fit:cover;background:#111;cursor:zoom-in}
.media video{cursor:auto}
.media.n2 img,.media.n3 img,.media.n2 video,.media.n3 video{height:220px}
.noMedia{margin:0 14px 10px;padding:10px 12px;border:1px dashed #d4d8d6;border-radius:10px;color:var(--muted);font-size:13px}
.post .txt{padding:10px 14px 0;white-space:pre-wrap;word-wrap:break-word}
.post .pf{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--line);margin-top:10px;align-items:center;flex-wrap:wrap}
.post .pf .ibtn{border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:600}
.post .pf .ibtn:hover{background:#f1f3f2}
.post .pf .ibtn.liked{color:#d23c6f}
.modBar{display:flex;gap:6px;margin-left:auto}
.coms{padding:4px 14px 12px;border-top:1px solid var(--line);background:#fafbfa}
.com{padding:8px 0;border-bottom:1px solid #eef0ef;font-size:14px}
.com:last-of-type{border-bottom:0}
.com b{margin-right:6px}
.comForm{display:flex;gap:8px;margin-top:8px}
.comForm input{flex:1}
/* ---------- registrar ---------- */
.steps .card h3{display:flex;align-items:center;gap:8px}
.num{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:inline-grid;place-items:center;font-size:13px;flex:none}
.actGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:12px}
.actOpt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.actOpt:hover{border-color:#b9c7c3}
.actOpt.on{border-color:var(--brand);background:var(--brand-soft)}
.actOpt b{font-size:13px;display:block}
.actOpt small{font-size:12px;display:block;margin-top:2px}
.actOpt .p{flex:none;font-weight:800;color:#8a6400;background:#fff7e0;border-radius:8px;padding:2px 8px;font-size:13px}
.catHead{font-size:13px;font-weight:700;color:var(--ink-2);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.prev{position:relative;border-radius:10px;overflow:hidden;background:#111;aspect-ratio:1}
.prev img,.prev video{width:100%;height:100%;object-fit:cover}
.prev button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.prev .vt{position:absolute;left:6px;bottom:6px;color:#fff;font-size:12px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px}
.progress{height:8px;background:#e5e9e7;border-radius:99px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:var(--brand);width:0;transition:width .2s}
.success{text-align:center;padding:30px 16px}
.success .big{font-size:52px}
/* ---------- puntaje / ranking ---------- */
.pickList{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:320px;overflow:auto}
.pickItem{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left;width:100%}
.pickItem:hover{border-color:var(--brand)}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.stat{background:#f7f9f8;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.stat.hl{background:var(--brand);border-color:var(--brand);color:#fff}
.stat.hl .l{color:#d5efeb}
.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#fff;border:1px solid var(--line);cursor:pointer}
.rk.top{border-color:#ecd48a;background:#fffbef}
.rk .pos{width:30px;text-align:center;font-weight:800;color:var(--muted)}
.rk.top .pos{color:var(--gold)}
.rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rk .pt{font-weight:800}
.rk .bar{height:6px;background:#eef0ef;border-radius:99px;margin-top:4px;overflow:hidden}
.rk .bar>div{height:100%;background:var(--s1);border-radius:99px}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:8px 6px;border-bottom:1px solid #eef0ef;text-align:left;vertical-align:middle}
.hist th{font-size:12px;color:var(--muted);font-weight:600}
.hist td.r,.hist th.r{text-align:right}
@media (max-width:560px){.hist{font-size:13px}.hist td,.hist th{padding:7px 4px}.actOpt:not(.on) small{display:none}.actGrid{grid-template-columns:1fr 1fr}.actOpt{flex-direction:column;gap:4px}}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.hbar .lb{width:44%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{flex:1;height:10px;background:#eef0ef;border-radius:99px;overflow:hidden}
.hbar .tr>div{height:100%;border-radius:99px}
.hbar .vv{width:62px;text-align:right;font-weight:700}
/* ---------- métricas ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>*{min-width:0}
#cRows input{min-width:130px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.chartBox{position:relative;width:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.heatWrap{overflow:auto;max-width:100%}
table.heat{border-collapse:separate;border-spacing:2px;font-size:12px}
table.heat th{font-weight:600;color:var(--ink-2);padding:4px 6px;white-space:nowrap}
table.heat th.col{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;text-align:left;vertical-align:bottom;max-width:28px}
table.heat th.rowh{text-align:right;position:sticky;left:0;background:var(--card);z-index:1}
table.heat td{width:30px;min-width:30px;height:28px;text-align:center;border-radius:4px;font-weight:700}
.podium{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:640px){.podium{grid-template-columns:1fr}}
.pod{border:1px solid #ecd48a;background:#fffbef;border-radius:12px;padding:10px;text-align:center}
.pod .m{font-size:24px}
.pod b{display:block;font-size:14px;margin-top:4px}
.pod .v{font-weight:800;font-size:18px}
/* ---------- admin ---------- */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:9px 8px;border-bottom:1px solid #eef0ef;text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.tblWrap{overflow:auto}
.modItem{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.modItem{grid-template-columns:1fr}}
.modItem .mm{display:grid;gap:4px}
.modItem .mm img,.modItem .mm video{width:100%;border-radius:10px;max-height:200px;object-fit:cover;background:#111;cursor:zoom-in}
/* ---------- modal / toast / lightbox ---------- */
.modalBg{position:fixed;inset:0;background:rgba(10,20,18,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modalBg{align-items:center}}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
@media (min-width:640px){.modal{border-radius:18px}}
.modal .x{float:right;border:0;background:#f1f3f2;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.tst{background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center}
.tst.bad{background:var(--bad)}
.tst.ok{background:var(--ok)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:150;display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:92vh;object-fit:contain}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo" id="logoBox">360</div><div style="min-width:0"><b id="appName">Huntsman Saludable 360</b><small id="corteLbl">Cargando…</small></div></div>
  <div id="userChip"></div>
</header>
<nav class="tabs" id="tabs">
  <a data-tab="muro"><span class="ic">🏠</span><span>Muro</span></a>
  <a data-tab="registrar"><span class="ic">➕</span><span>Registrar</span></a>
  <a data-tab="puntaje"><span class="ic">🏆</span><span>Mi puntaje</span></a>
  <a data-tab="metricas" class="hidden"><span class="ic">📊</span><span>Métricas</span></a>
  <a data-tab="admin"><span class="ic">⚙️</span><span>Admin</span></a>
</nav>
<main id="app"><div class="loading"><span class="spin"></span> Cargando…</div></main>
<div id="modalRoot"></div>
<div id="toast"></div>

if (LOGO) {
  const lb = document.getElementById("logoBox");
  if (lb) lb.outerHTML = `<img class="brandLogo" src="${LOGO}" alt="Huntsman">`;

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ---------- Estado ----------
const S = {
  cfg: undefined, parts: {}, acts: {}, mods: {}, res: null, corteSel: null,
  user: null, mod: null, tab: "muro", adminSec: "moderacion", subs: {}, loaded: {}
};
const F = { first: [], more: [], cursor: null, end: false, open: new Set(), coms: {} };   // muro
const R = { actId: null, files: [], fecha: null, com: "", q: "", sending: false, done: null }; // registrar
const P = { sel: null, q: "", hist: {} };  // puntaje
const charts = {};

try { S.user = JSON.parse(localStorage.getItem("s360_user") || "null"); } catch (e) {}
try { S.mod = JSON.parse(sessionStorage.getItem("s360_mod") || "null"); } catch (e) {}

// ---------- Utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const fmt = n => (Math.round((n || 0) * 10) / 10).toLocaleString("es-CO", { maximumFractionDigits: 1 });
const MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fFecha = f => { if (!f) return ""; const [y, m, d] = f.split("-"); return `${+d} ${MES[+m - 1]} ${y}`; };
const hoy = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Bogota" });
const addDays = (f, n) => { const d = new Date(f + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const semana = f => { const d = new Date(f + "T12:00:00Z"); const wd = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - wd); return "w" + d.toISOString().slice(0, 10).replace(/-/g, ""); };
const semLabel = w => { const s = w.slice(1); return `${+s.slice(6, 8)} ${MES[+s.slice(4, 6) - 1]}`; };
const initials = n => String(n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
const avColor = id => SERIES[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % SERIES.length];
const newId = col => doc(collection(db, col)).id;
const errMsg = e => {
  const c = e && (e.code || "");
  if (c.includes("permission-denied")) return "Permiso denegado. Verifica tu PIN (o las reglas de Firestore).";
  if (c.includes("unavailable")) return "Sin conexión. Intenta de nuevo.";
  return (e && e.message) || String(e);
};

async function sha(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
const hPart = (pid, pin) => sha(`s360|p|${pid}|${pin}`);
const hMod = (mid, pin) => sha(`s360|m|${mid}|${pin}`);

// Prueba de identidad dentro de un lote (ver reglas de seguridad)
function proof(batch, tipo, id, h) {
  const ref = doc(collection(db, "proofs"));
  batch.set(ref, { t: serverTimestamp(), tipo, id, h });
  return ref.id;
}
const modProof = b => proof(b, "m", S.mod.id, S.mod.h);
const userProof = b => proof(b, "p", S.user.pid, S.user.h);

// Cortes
const cortes = () => (S.cfg?.cortes || CORTES_DEFAULT).slice().sort((a, b) => a.inicio.localeCompare(b.inicio));
const corteDe = f => cortes().find(c => c.inicio <= f && f <= c.fin) || null;
const corteActual = () => { const t = hoy(); const cs = cortes(); return corteDe(t) || cs.filter(c => c.inicio <= t).pop() || cs[0]; };
const corteById = id => cortes().find(c => c.id === id);

// Cloudinary
const cld = (url, tr) => url && url.includes("/upload/") ? url.replace("/upload/", `/upload/${tr}/`) : url;
const poster = url => cld(url, "so_0,w_800,c_limit").replace(/\.[a-z0-9]+$/i, ".jpg");

// Listas ordenadas
const actList = () => Object.values(S.acts).sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999) || a.nombre.localeCompare(b.nombre));
const partList = () => Object.values(S.parts).sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
const catList = () => { const c = []; actList().forEach(a => { if (a.categoria && !c.includes(a.categoria)) c.push(a.categoria); }); return c; };
const catColor = cat => SERIES[Math.max(0, catList().indexOf(cat)) % SERIES.length];

// ---------- UI: toast, modal, lightbox ----------
function toast(msg, type = "") {
  const t = document.createElement("div");
  t.className = "tst " + type; t.textContent = msg;
  $("#toast").appendChild(t);
  setTimeout(() => t.remove(), type === "bad" ? 5000 : 2800);
}
function openModal(html, onClose) {
  const bg = document.createElement("div");
  bg.className = "modalBg";
  bg.innerHTML = `<div class="modal" role="dialog"><button class="x" aria-label="Cerrar">✕</button>${html}</div>`;
  $("#modalRoot").appendChild(bg);
  let closed = false;
  const close = (v) => { if (closed) return; closed = true; bg.remove(); onClose && onClose(v); };
  bg.addEventListener("click", e => { if (e.target === bg) close(); });
  $(".x", bg).onclick = () => close();
  return { el: $(".modal", bg), close };
}
function lightbox(url) {
  const lb = document.createElement("div");
  lb.className = "lightbox";
  lb.innerHTML = `<img src="${esc(url)}" alt="Evidencia">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}
function busy(btn, on, txt) {
  if (!btn) return;
  if (on) { btn.dataset.t = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span> ${txt || "Procesando…"}`; }
  else { btn.disabled = false; if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }
}
function pinOk(pin, min = 4, max = 4) { return new RegExp(`^\\d{${min},${max}}$`).test(pin); }

// =====================================================================
//  Arranque y suscripciones
// =====================================================================
onSnapshot(doc(db, "config", "app"), snap => {
  if (!snap.exists()) { S.cfg = null; renderSetup(); return; }
  S.cfg = snap.data();
  if (!S.corteSel || !corteById(S.corteSel)) S.corteSel = corteActual().id;
  startSubs();
  renderHeader();
  if (S.setupMode) return;          // estamos en el asistente inicial
  route();
}, err => fatal(err));

function fatal(err) {
  $("#app").innerHTML = `<div class="card narrow"><h3>No se pudo conectar</h3>
    <p>${esc(errMsg(err))}</p>
    <p class="muted">Si acabas de crear el proyecto, verifica que Firestore esté creado y que publicaste las reglas de seguridad.</p></div>`;
}

function startSubs() {
  if (S.subs.base) return;
  S.subs.base = true;
  onSnapshot(collection(db, "participantes"), s => { S.parts = {}; s.forEach(d => S.parts[d.id] = { id: d.id, ...d.data() }); S.loaded.parts = true; refresh(); });
  onSnapshot(collection(db, "actividades"), s => { S.acts = {}; s.forEach(d => S.acts[d.id] = { id: d.id, ...d.data() }); S.loaded.acts = true; refresh(); });
  onSnapshot(collection(db, "mods"), s => { S.mods = {}; s.forEach(d => S.mods[d.id] = { id: d.id, ...d.data() }); S.loaded.mods = true; refresh(); });
}
// Totales del corte (solo moderadores): se calculan en vivo a partir de los registros
function subCorte() {
  const want = S.mod ? S.corteSel : null;
  if (S.subs.corteKey === want) return;
  if (S.subs.corte) { S.subs.corte(); S.subs.corte = null; }
  S.subs.corteKey = want; S.res = null; S.regsCorte = [];
  if (!want) return;
  S.subs.corte = onSnapshot(query(collection(db, "registros"), where("corte", "==", want)), s => {
    if (S.subs.corteKey !== want) return;
    S.regsCorte = s.docs.map(d => ({ id: d.id, ...d.data() }));
    S.res = agg(S.regsCorte);
    refresh();
  }, e => toast(errMsg(e), "bad"));
}
// Suma los registros que cuentan (estado "aprobado")
function agg(list) {
  const R0 = { totalPts: 0, totalN: 0, p: {}, act: {}, sem: {}, ps: {}, sinRevisar: 0, anulados: 0 };
  list.forEach(r => {
    if (r.estado === "rechazado") { R0.anulados++; return; }
    if (r.estado !== "aprobado") return;
    if (r.revisado === false) R0.sinRevisar++;
    const w = semana(r.fecha), pid = r.participanteId, aid = r.actividadId, v = r.puntos || 0;
    R0.totalPts += v; R0.totalN++;
    const p = R0.p[pid] = R0.p[pid] || { pts: 0, n: 0, a: {} }; p.pts += v; p.n++;
    const pa = p.a[aid] = p.a[aid] || { n: 0, pts: 0 }; pa.n++; pa.pts += v;
    const a = R0.act[aid] = R0.act[aid] || { n: 0, pts: 0 }; a.n++; a.pts += v;
    R0.sem[w] = (R0.sem[w] || 0) + v;
    (R0.ps[pid] = R0.ps[pid] || {})[w] = (R0.ps[pid][w] || 0) + v;
  });
  return R0;
}
function setCorte(id) { if (id === S.corteSel) return; S.corteSel = id; subCorte(); renderHeader(); route(); }

function ensureUser() {
  if (S.user && S.parts[S.user.pid]) return Promise.resolve(S.user);
  return new Promise(resolve => {
    let done = false;
    const m = openModal(`<div id="idBody"></div>`, () => { if (!done) resolve(null); });
    const body = $("#idBody", m.el);
    const finish = u => { done = true; m.close(); renderHeader(); resolve(u); };

    function stepSearch() {
      body.innerHTML = `<h3>¿Quién eres?</h3>
        <input type="search" id="idq" placeholder="Escribe tu nombre…" autocomplete="off">
        <div class="pickList" id="idList"></div>
        <p class="muted" style="font-size:13px;margin-top:10px">¿No apareces? Pide a un administrador que te agregue al programa.</p>`;
      const draw = () => {
        const q = norm($("#idq", body).value);
        const list = partList().filter(p => p.activo !== false && (!q || norm(p.nombre).includes(q)));
        $("#idList", body).innerHTML = list.map(p => `<button class="pickItem" data-id="${p.id}">
          <span class="avatar" style="background:${avColor(p.id)}">${esc(initials(p.nombre))}</span>
          <span class="grow"><b>${esc(p.nombre)}</b>${p.area ? `<br><small>${esc(p.area)}</small>` : ""}</span>
          ${p.pinSet ? "" : `<span class="badge brand">Nuevo</span>`}</button>`).join("") || `<div class="empty">Sin resultados</div>`;
      };
      $("#idq", body).oninput = draw; draw();
      setTimeout(() => $("#idq", body)?.focus(), 50);
      $("#idList", body).onclick = e => { const b = e.target.closest(".pickItem"); if (b) stepPin(b.dataset.id); };
    }

    function stepPin(pid) {
      const p = S.parts[pid];
      const nuevo = !p.pinSet;
      body.innerHTML = `<h3>${esc(p.nombre)}</h3>
        ${nuevo ? `<p class="notice info" style="margin-bottom:12px">Es tu primera vez. Crea un PIN de <b>4 dígitos</b> que solo tú conozcas. Lo usarás para registrar tus actividades.</p>` : `<p class="muted">Ingresa tu PIN de 4 dígitos.</p>`}
        <label class="fld"><span>${nuevo ? "Crea tu PIN" : "PIN"}</span><input type="password" inputmode="numeric" maxlength="4" class="pin" id="pin1" autocomplete="off"></label>
        ${nuevo ? `<label class="fld"><span>Repite tu PIN</span><input type="password" inputmode="numeric" maxlength="4" class="pin" id="pin2" autocomplete="off"></label>` : ""}
        <label class="row" style="margin:6px 0 12px;font-size:14px"><input type="checkbox" id="rem" checked> Recordarme en este dispositivo</label>
        <div class="err" id="pinErr"></div>
        <button class="btn primary block" id="pinGo">${nuevo ? "Crear PIN y entrar" : "Entrar"}</button>
        <div class="row between" style="margin-top:12px"><button class="btn ghost sm" id="back">← Cambiar nombre</button>
        ${nuevo ? "" : `<small>¿Olvidaste tu PIN? Pide a un moderador que lo restablezca.</small>`}</div>`;
      setTimeout(() => $("#pin1", body)?.focus(), 50);
      $("#back", body).onclick = stepSearch;
      const go = async () => {
        const pin = $("#pin1", body).value.trim(), err = $("#pinErr", body), btn = $("#pinGo", body);
        err.textContent = "";
        if (!pinOk(pin)) { err.textContent = "El PIN debe tener exactamente 4 números."; return; }
        if (nuevo && pin !== $("#pin2", body).value.trim()) { err.textContent = "Los PIN no coinciden."; return; }
        busy(btn, true, "Verificando…");
        try {
          const h = await hPart(pid, pin);
          const b = writeBatch(db);
          if (nuevo) {
            b.set(doc(db, "pins", pid), { h });
            b.update(doc(db, "participantes", pid), { pinSet: true, pinFecha: serverTimestamp() });
          } else {
            const pr = proof(b, "p", pid, h);
            b.update(doc(db, "participantes", pid), { ultimoAcceso: serverTimestamp(), _proof: pr });
          }
          await b.commit();
          saveUser({ pid, h }, $("#rem", body).checked);
          toast(nuevo ? "¡PIN creado! Bienvenido(a) 🎉" : `¡Hola, ${p.nombre.split(" ")[0]}!`, "ok");
          finish(S.user);
        } catch (e) {
          busy(btn, false);
          err.textContent = nuevo ? "No se pudo crear el PIN. Es posible que este nombre ya tenga PIN: pide a un moderador que lo restablezca." : "PIN incorrecto. Intenta de nuevo.";
          console.error(e);
        }
      };
      $("#pinGo", body).onclick = go;
      $$("input.pin", body).forEach(i => i.onkeydown = e => { if (e.key === "Enter") go(); });
    }
    stepSearch();
  });
}

async function loadMore() {
  const btn = $("#more"); busy(btn, true, "Cargando…");
  try {
    const after = F.cursor || F.lastFirst;
    if (!after) { F.end = true; drawPosts(); return; }
    const s = await getDocs(query(collection(db, "registros"), orderBy("creado", "desc"), startAfter(after), limit(15)));
    s.docs.forEach(d => F.more.push({ id: d.id, ...d.data() }));
    if (s.docs.length) F.cursor = s.docs[s.docs.length - 1];
    if (s.docs.length < 15) F.end = true;
    drawPosts();
  } catch (e) { toast(errMsg(e), "bad"); busy(btn, false); }
}
function feedItems() {
  const m = new Map();
  [...F.first, ...F.more].forEach(r => { if (!m.has(r.id)) m.set(r.id, r); });
  return [...m.values()].filter(r => r.estado !== "rechazado");
}
function findReg(id) { return [...F.first, ...F.more].find(r => r.id === id) || Object.values(P.hist).flat().find(r => r.id === id) || (S.modList || []).find(r => r.id === id); }

    + `<form class="comForm" data-cf="${id}"><input type="text" maxlength="300" placeholder="Escribe un comentario…" required><button class="btn primary sm">Enviar</button></form>`;

function bindPostEvents(root) {
  if (!root || root.dataset.bound) return;
  root.dataset.bound = 1;
  root.addEventListener("click", async e => {
    const img = e.target.closest("img[data-full]"); if (img) { lightbox(img.dataset.full); return; }
    const lk = e.target.closest("[data-like]"); if (lk) { toggleLike(lk.dataset.like); return; }
    const cm = e.target.closest("[data-com]"); if (cm) { toggleComs(cm.dataset.com); return; }
    const md = e.target.closest("[data-mod]"); if (md) { moderar(md.dataset.id, md.dataset.mod, md); return; }
  });
  root.addEventListener("submit", e => {
    const f = e.target.closest("[data-cf]"); if (!f) return;
    e.preventDefault(); sendCom(f.dataset.cf, f.querySelector("input"));
  });
}

async function toggleLike(id) {
  const u = await ensureUser(); if (!u) return;
  const r = findReg(id); if (!r) return;
  const liked = !!(r.likes || {})[u.pid];
  r.likes = { ...(r.likes || {}) }; if (liked) delete r.likes[u.pid]; else r.likes[u.pid] = true;
  drawPosts();
  try {
    const b = writeBatch(db); const pr = userProof(b);
    b.update(doc(db, "registros", id), { [`likes.${u.pid}`]: liked ? deleteField() : true, _proof: pr });
    await b.commit();
  } catch (e) {
    if (liked) r.likes[u.pid] = true; else delete r.likes[u.pid];
    drawPosts(); if (!sessionFail(e)) toast(errMsg(e), "bad");
  }
}
async function toggleComs(id) {
  if (F.open.has(id)) { F.open.delete(id); drawPosts(); return; }
  F.open.add(id); drawPosts();
  await loadComs(id);
}
async function loadComs(id) {
  try {
    const s = await getDocs(query(collection(db, "registros", id, "comentarios"), orderBy("creado", "asc")));
    F.coms[id] = s.docs.map(d => d.data()).filter(c => !c.oculto);
  } catch (e) { F.coms[id] = []; toast(errMsg(e), "bad"); }
  const box = $("#coms-" + id); if (box) box.innerHTML = comsHTML(id);
}
async function sendCom(id, input) {
  const texto = input.value.trim(); if (!texto) return;
  const u = await ensureUser(); if (!u) return;
  input.disabled = true;
  try {
    const b = writeBatch(db); const pr = userProof(b);
    b.set(doc(collection(db, "registros", id, "comentarios")), { pid: u.pid, texto, creado: serverTimestamp(), _proof: pr });
    b.update(doc(db, "registros", id), { nCom: increment(1) });
    await b.commit();
    const r = findReg(id); if (r) r.nCom = (r.nCom || 0) + 1;
    input.value = "";
    await loadComs(id); drawPosts();
  } catch (e) { if (!sessionFail(e)) toast(errMsg(e), "bad"); }
  input.disabled = false;
}

// =====================================================================
//  Moderación: los puntos se suman al instante; el moderador revisa
//  después y puede dejarlos (✔ OK) o anularlos.
// =====================================================================
async function moderar(id, nuevo, btn) {
  if (!S.mod) { toast("Inicia sesión como moderador en Admin", "bad"); return; }
  const r = findReg(id); if (!r) return;
  let motivo = "";
  if (nuevo === "rechazado") {
    motivo = prompt("¿Por qué se anula este registro? (sus puntos se descontarán)", "");
    if (motivo === null) return;
  }
  busy(btn, true, "");
  try {
    const b = writeBatch(db); const pr = modProof(b);
    b.update(doc(db, "registros", id), { estado: nuevo, revisado: true, moderadoPor: S.mod.nombre, moderadoEn: serverTimestamp(), motivo: motivo || "", _proof: pr });
    await b.commit();
    const old = r.estado;
    r.estado = nuevo; r.revisado = true;
    toast(nuevo === "rechazado" ? "Registro anulado: se descontaron sus puntos" : old === "rechazado" ? "Registro restaurado ✔" : "Marcado como revisado ✔", nuevo === "rechazado" ? "" : "ok");
    if (S.tab === "muro") drawPosts(); else route();
  } catch (e) { busy(btn, false); modFail(e); }
}
function modFail(e) {
  if (String(e?.code || "").includes("permission-denied")) { toast("Permiso denegado: tu sesión de moderador no es válida. Vuelve a entrar.", "bad"); S.mod = null; sessionStorage.removeItem("s360_mod"); if (S.tab === "admin") route(); }
  else toast(errMsg(e), "bad");
}

function drawActs() {

    return `<div class="catHead"><span class="dot" style="background:${catColor(cat)}"></span>${esc(cat)}</div><div class="actGrid">` +
      as.map(a => `<button type="button" class="actOpt ${R.actId === a.id ? "on" : ""}" data-a="${a.id}"><span><b>${esc(a.nombre)}</b>${a.descripcion ? `<small class="muted">${esc(a.descripcion)}</small>` : ""}</span><span class="p">+${fmt(a.puntos)}</span></button>`).join("") + `</div>`;
  }).join("") || `<div class="empty">No hay actividades que coincidan.</div>`;
  box.onclick = e => { const b = e.target.closest("[data-a]"); if (!b) return; R.actId = b.dataset.a; drawActs(); drawSum(); };
}
function drawSum() {
  const box = $("#sumBox"); if (!box) return;
  const a = S.acts[R.actId];
  const c = corteDe(R.fecha);
  box.innerHTML = a ? `Vas a registrar <b style="color:var(--ink)">${esc(a.nombre)}</b> por <b style="color:var(--ink)">+${fmt(a.puntos)} pts</b> el ${fFecha(R.fecha)}${c ? ` (corte ${esc(c.nombre)})` : ""}.` : "Elige una actividad para continuar.";
}
async function addFiles(files) {
  for (const f of files) {
    if (R.files.length >= MAX_FILES) { toast(`Máximo ${MAX_FILES} archivos por registro`, "bad"); break; }
    const isVid = f.type.startsWith("video/"), isImg = f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name);
    if (!isVid && !isImg) { toast("Solo se permiten fotos o videos", "bad"); continue; }
    const item = { file: f, tipo: isVid ? "video" : "img", url: URL.createObjectURL(f) };
    if (isVid) {
      if (f.size > MAX_VIDEO_MB * 1048576) { toast(`El video pesa más de ${MAX_VIDEO_MB} MB. Graba uno más corto.`, "bad"); continue; }
      const dur = await videoDur(item.url);
      if (dur > MAX_VIDEO_SEG + 1) { toast(`El video dura ${Math.round(dur)} s. Máximo ${MAX_VIDEO_SEG} s.`, "bad"); continue; }
      item.dur = dur;
    }
    R.files.push(item);
  }
  drawPrevs();
}
function videoDur(url) {
  return new Promise(res => { const v = document.createElement("video"); v.preload = "metadata"; v.onloadedmetadata = () => res(v.duration || 0); v.onerror = () => res(0); v.src = url; setTimeout(() => res(0), 6000); });
}
function drawPrevs() {
  const box = $("#prevs"); if (!box) return;
  box.innerHTML = R.files.map((f, i) => `<div class="prev">${f.tipo === "video" ? `<video src="${f.url}" muted playsinline></video><span class="vt">🎥 ${f.dur ? Math.round(f.dur) + " s" : "video"}</span>` : `<img src="${f.url}" alt="">`}<button type="button" data-rm="${i}" aria-label="Quitar">✕</button></div>`).join("");
  box.onclick = e => { const b = e.target.closest("[data-rm]"); if (!b) return; URL.revokeObjectURL(R.files[+b.dataset.rm].url); R.files.splice(+b.dataset.rm, 1); drawPrevs(); };
}

async function compressImage(file) {
  try {
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch (e) { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
    const max = 1600, w0 = bmp.width, h0 = bmp.height, k = Math.min(1, max / Math.max(w0, h0));
    const cv = document.createElement("canvas"); cv.width = Math.round(w0 * k); cv.height = Math.round(h0 * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.82));
    return blob && blob.size < file.size ? blob : file;
  } catch (e) { return file; }   // formatos no soportados (p.ej. HEIC en algunos navegadores): se sube original
}
function uploadCld(blob, name, onProg) {
  return new Promise((res, rej) => {
    const fd = new FormData();
    fd.append("file", blob, name);
    fd.append("upload_preset", S.cfg.preset);
    fd.append("folder", "saludable360");
    const x = new XMLHttpRequest();
    x.open("POST", `https://api.cloudinary.com/v1_1/${encodeURIComponent(S.cfg.cloudName)}/auto/upload`);
    x.upload.onprogress = e => e.lengthComputable && onProg(e.loaded / e.total);
    x.onload = () => { try { const j = JSON.parse(x.responseText); if (x.status < 300 && j.secure_url) res(j); else rej(new Error(j.error?.message || "Error subiendo archivo")); } catch (e) { rej(e); } };
    x.onerror = () => rej(new Error("No se pudo subir el archivo (revisa tu conexión)."));
    x.send(fd);
  });
}

async function sendRegistro() {
  const err = $("#regErr"), btn = $("#send"); err.textContent = "";
  const u = S.user && S.parts[S.user.pid] ? S.user : await ensureUser();
  if (!u) { err.textContent = "Primero identifícate con tu nombre y PIN."; return; }
  const a = S.acts[R.actId];
  if (!a) { err.textContent = "Elige la actividad que realizaste."; return; }
  if (!R.fecha || R.fecha > hoy() || R.fecha < addDays(hoy(), -DIAS_ATRAS)) { err.textContent = `La fecha debe estar entre los últimos ${DIAS_ATRAS} días.`; return; }
  const c = corteDe(R.fecha);
  if (!c) { err.textContent = "La fecha no pertenece a ningún corte configurado. Avisa a un administrador."; return; }
  if (!R.files.length) { err.textContent = "Adjunta al menos una foto o video como evidencia."; return; }
  R.sending = true; busy(btn, true, "Subiendo evidencia…");
  const prog = $("#prog"); prog.classList.remove("hidden");
  const bar = $("#prog>div");
  try {
    const media = [];
    for (let i = 0; i < R.files.length; i++) {
      const f = R.files[i];
      const blob = f.tipo === "img" ? await compressImage(f.file) : f.file;
      const j = await uploadCld(blob, f.tipo === "img" ? "foto.jpg" : f.file.name, p => bar.style.width = Math.round(((i + p) / R.files.length) * 95) + "%");
      media.push({ url: j.secure_url, tipo: j.resource_type === "video" ? "video" : "img", w: j.width || 0, h: j.height || 0 });
    }
    busy(btn, true, "Guardando…");
    const b = writeBatch(db); const pr = userProof(b);
    b.set(doc(collection(db, "registros")), {
      participanteId: u.pid, actividadId: a.id, puntos: a.puntos, fecha: R.fecha, corte: c.id,
      comentario: (R.com || "").trim().slice(0, 300), media, estado: "aprobado", revisado: false, origen: "app",
      likes: {}, nCom: 0, creado: serverTimestamp(), _proof: pr
    });
    await b.commit();
    bar.style.width = "100%";
    R.files.forEach(f => URL.revokeObjectURL(f.url));
    Object.keys(P.hist).forEach(k => { if (k.startsWith(u.pid + "|")) delete P.hist[k]; });
    R.done = { actId: a.id }; R.actId = null; R.files = []; R.com = ""; R.q = ""; R.fecha = null; R.sending = false;
    renderRegistrar();
  } catch (e) {
    R.sending = false; busy(btn, false); prog.classList.add("hidden");
    if (sessionFail(e)) { route(); return; }
    err.textContent = errMsg(e); console.error(e);
  }
}

function ranking() {
  const res = S.res || { p: {} };
  const ids = new Set([...Object.keys(res.p || {}), ...partList().filter(p => p.activo !== false).map(p => p.id)]);
  return [...ids].filter(id => S.parts[id]).map(id => ({ id, nombre: S.parts[id].nombre, pts: Math.round(((res.p || {})[id]?.pts || 0) * 10) / 10, n: (res.p || {})[id]?.n || 0 }))
    .sort((a, b) => b.pts - a.pts || a.nombre.localeCompare(b.nombre, "es"));
}

async function drawPerson(rk) {
  const box = $("#person"); if (!box || !P.sel || !S.parts[P.sel]) return;
  const pid = P.sel, p = S.parts[pid];
  const pos = rk.findIndex(r => r.id === pid) + 1;
  const key = pid + "|" + S.corteSel;
  // Moderadores: historial en vivo desde los registros del corte; participantes: consulta propia
  if (S.mod && S.res) P.hist[key] = S.regsCorte.filter(r => r.participanteId === pid).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const hist = P.hist[key];
  const me = (hist ? agg(hist).p[pid] : null) || { pts: 0, n: 0, a: {} };
  const wk = semana(hoy());
  const semPts = hist ? (agg(hist).ps[pid]?.[wk] || 0) : 0;
  const byAct = Object.entries(me.a || {}).filter(([, v]) => v.n > 0).sort((a, b) => b[1].pts - a[1].pts);
  const maxA = Math.max(1, ...byAct.map(([, v]) => v.pts));
  const leader = rk[0]?.pts || 0, fifth = rk[TOPN - 1]?.pts || 0;
  let meta = "";
  if (S.mod && pos && me.pts > 0) meta = pos === 1 ? "¡Vas de primero! 🔥" : pos <= TOPN ? `Estás en el Top ${TOPN}. Te faltan ${fmt(leader - me.pts)} pts para el 1.º lugar.` : `Te faltan ${fmt(fifth - me.pts)} pts para alcanzar el ${TOPN}.º lugar.`;
  box.innerHTML = `<div class="card">
    <div class="row"><span class="avatar" style="background:${avColor(pid)};width:48px;height:48px;font-size:16px">${esc(initials(p.nombre))}</span>
      <div class="grow"><h3 style="margin:0">${esc(p.nombre)}</h3><small>${meta}</small></div></div>
    <div class="hero">
      <div class="stat hl"><div class="v">${hist ? fmt(me.pts) : "…"}</div><div class="l">puntos acumulados</div></div>
      ${S.mod ? `<div class="stat"><div class="v">#${pos || "–"}</div><div class="l">posición de ${rk.length}</div></div>` : ""}
      <div class="stat"><div class="v">${hist ? me.n || 0 : "…"}</div><div class="l">actividades registradas</div></div>
      <div class="stat"><div class="v">${hist ? fmt(semPts) : "…"}</div><div class="l">pts esta semana</div></div>
    </div>
    ${byAct.length ? `<h3 style="margin-top:6px">Puntos por actividad</h3>${byAct.map(([aid, v]) => { const a = S.acts[aid] || { nombre: aid }; return `<div class="hbar"><span class="lb" title="${esc(a.nombre)}">${esc(a.nombre)}</span><span class="tr"><div style="width:${(v.pts / maxA) * 100}%;background:${catColor(a.categoria)}"></div></span><span class="vv">${fmt(v.pts)}</span></div>`; }).join("")}` : ""}
    ${S.mod ? "" : `<p class="muted" style="font-size:13px;margin:4px 0 0">Tus puntos se suman al instante. Los moderadores revisan las evidencias y pueden anular las que no cumplan. Los ganadores (Top ${TOPN}) se anuncian al cierre del corte.</p>`}
    <h3 style="margin-top:16px">Historial del corte</h3>
    <div class="tblWrap" id="histBox">${hist ? histHTML(hist) : `<div class="muted"><span class="spin"></span> Cargando…</div>`}</div>
  </div>`;
  if (!hist) {
    try {
      const s = await getDocs(query(collection(db, "registros"), where("participanteId", "==", pid), where("corte", "==", S.corteSel)));
      P.hist[key] = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.fecha.localeCompare(a.fecha));
      if (P.sel === pid && S.tab === "puntaje") drawPerson(rk);
    } catch (e) { $("#histBox") && ($("#histBox").innerHTML = `<div class="err">${esc(errMsg(e))}</div>`); }
  }
  const hb = $("#histBox"); if (hb && !hb.dataset.b) { hb.dataset.b = 1; hb.onclick = e => { const md = e.target.closest("[data-mod]"); if (md) { e.stopPropagation(); moderar(md.dataset.id, md.dataset.mod, md).then(() => { delete P.hist[key]; }); } const im = e.target.closest("img[data-full]"); if (im) lightbox(im.dataset.full); }; }
}
function histHTML(list) {

      ${S.mod ? `<td style="white-space:nowrap">${r.estado === "aprobado" ? `${r.revisado === false ? `<button class="btn ok sm" data-mod="aprobado" data-id="${r.id}" title="Marcar como revisado">✔</button> ` : ""}<button class="btn bad sm" data-mod="rechazado" data-id="${r.id}">Anular</button>` : `<button class="btn sm" data-mod="aprobado" data-id="${r.id}">Restaurar</button>`}</td>` : ""}</tr>`).join("") + `</tbody></table>`;

      <div class="card"><h3>Puntos por categoría y persona</h3><div class="legend" id="lgCat"></div><div class="chartBox" id="cbCat"><canvas id="chCat"></canvas></div></div>
    </div>
    <div class="card"><h3>¿Quién hace qué? — veces que cada persona realizó cada actividad</h3><div class="heatWrap" id="heat"></div></div>
    <div class="grid2">
      <div class="card"><h3>Actividades más realizadas</h3><div class="legend" id="lgAct"></div><div class="chartBox" id="cbAct"><canvas id="chAct"></canvas></div></div>
      <div class="card"><h3>Evolución semanal (puntos acumulados, Top ${TOPN})</h3><div class="chartBox" style="height:320px"><canvas id="chSem"></canvas></div></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-bottom:24px"><button class="btn sm" id="csv">⬇️ Descargar datos del corte (CSV)</button></div>`}`;
  bindCorteSelect();
  if (!res) return;
  $("#csv").onclick = () => exportCSV(S.corteSel, $("#csv"));
  if (!window.Chart) { toast("No se pudo cargar la librería de gráficas", "bad"); return; }

}

function drawCharts(res, rk) {
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = "#52514e";
  Chart.defaults.plugins.legend.display = false;
  const grid = { color: "#eceeed" }, tick = { color: "#52514e" };
  const people = rk.filter(r => r.pts > 0);
  const hFor = n => Math.max(160, n * 30 + 40);
  const barBase = { borderRadius: 4, borderSkipped: "start", maxBarThickness: 22, borderWidth: 0 };
  const pts = v => `${fmt(v)} pts`;

  // 1. Ranking
  $("#cbRank").style.height = hFor(people.length) + "px";
  charts.rank = new Chart($("#chRank"), {
    type: "bar",
    data: { labels: people.map(r => r.nombre), datasets: [{ ...barBase, data: people.map(r => r.pts), backgroundColor: people.map((r, i) => i < TOPN ? SERIES[0] : "#a9b3b0") }] },
    options: { indexAxis: "y", maintainAspectRatio: false, scales: { x: { grid, ticks: tick, beginAtZero: true }, y: { grid: { display: false }, ticks: tick } },
      plugins: { tooltip: { callbacks: { label: c => ` ${pts(c.raw)} · ${people[c.dataIndex].n} actividades` } } } }
  });

  // 2. Categoría × persona (barras apiladas)
  const cats = catList();
  $("#lgCat").innerHTML = cats.map(c => `<span><i class="dot" style="background:${catColor(c)}"></i>${esc(c)}</span>`).join("");
  $("#cbCat").style.height = hFor(people.length) + "px";
  charts.cat = new Chart($("#chCat"), {
    type: "bar",
    data: {
      labels: people.map(r => r.nombre),
      datasets: cats.map(cat => ({
        ...barBase, borderRadius: 0, label: cat, backgroundColor: catColor(cat), borderColor: "#ffffff", borderWidth: { right: 2 },
        data: people.map(r => Object.entries(res.p[r.id]?.a || {}).reduce((s, [aid, v]) => s + ((S.acts[aid] || {}).categoria === cat ? v.pts : 0), 0))
      }))
    },
    options: { indexAxis: "y", maintainAspectRatio: false, scales: { x: { stacked: true, grid, ticks: tick, beginAtZero: true }, y: { stacked: true, grid: { display: false }, ticks: tick } },
      plugins: { tooltip: { mode: "y", intersect: false, callbacks: { label: c => ` ${c.dataset.label}: ${pts(c.raw)}` } } } }
  });

  // 3. Mapa de calor persona × actividad
  const acts = actList().filter(a => res.act?.[a.id]?.n > 0);
  let maxN = 1; people.forEach(r => acts.forEach(a => { maxN = Math.max(maxN, res.p[r.id]?.a?.[a.id]?.n || 0); }));
  const cell = n => { if (!n) return `background:#f4f5f4;color:#b8bdbb`; const i = Math.min(SEQ.length - 1, Math.floor((n / maxN) * (SEQ.length - 1) + 0.0001)); return `background:${SEQ[Math.max(0, i)]};color:${i >= 3 ? "#fff" : "#0b0b0b"}`; };
  $("#heat").innerHTML = people.length && acts.length ? `<table class="heat"><thead><tr><th></th>${acts.map(a => `<th class="col" title="${esc(a.nombre)}">${esc(a.nombre.length > 24 ? a.nombre.slice(0, 23) + "…" : a.nombre)}</th>`).join("")}<th class="col">TOTAL PTS</th></tr></thead><tbody>` +
    people.map(r => `<tr><th class="rowh">${esc(r.nombre)}</th>${acts.map(a => { const v = res.p[r.id]?.a?.[a.id]; const n = v?.n || 0; return `<td style="${cell(n)}" title="${esc(r.nombre)} · ${esc(a.nombre)}: ${n} ${n === 1 ? "vez" : "veces"}${n ? `, ${fmt(v.pts)} pts` : ""}">${n || "·"}</td>`; }).join("")}<td style="background:#fffbef;color:#0b0b0b;min-width:48px">${fmt(r.pts)}</td></tr>`).join("") +
    `</tbody></table><div class="legend" style="margin-top:8px"><span>Menos</span>${SEQ.map(c => `<i class="dot" style="background:${c}"></i>`).join("")}<span>Más veces</span></div>` : `<div class="empty">Aún no hay actividades aprobadas en este corte.</div>`;

  // 4. Actividades más realizadas
  const actsSorted = acts.slice().sort((a, b) => res.act[b.id].n - res.act[a.id].n);
  const actCats = cats.filter(c => actsSorted.some(a => a.categoria === c));
  $("#lgAct").innerHTML = actCats.map(c => `<span><i class="dot" style="background:${catColor(c)}"></i>${esc(c)}</span>`).join("");
  $("#cbAct").style.height = hFor(actsSorted.length) + "px";
  charts.act = new Chart($("#chAct"), {
    type: "bar",
    data: { labels: actsSorted.map(a => a.nombre), datasets: [{ ...barBase, data: actsSorted.map(a => res.act[a.id].n), backgroundColor: actsSorted.map(a => catColor(a.categoria)) }] },
    options: { indexAxis: "y", maintainAspectRatio: false, scales: { x: { grid, ticks: { ...tick, precision: 0 }, beginAtZero: true }, y: { grid: { display: false }, ticks: tick } },
      plugins: { tooltip: { callbacks: { label: c => ` ${c.raw} veces · ${pts(res.act[actsSorted[c.dataIndex].id].pts)}` } } } }
  });

  // 5. Evolución semanal acumulada del Top 5
  const cr = corteById(S.corteSel);
  const weeks = [];
  if (cr) { let w = semana(cr.inicio); const last = semana(hoy() < cr.fin ? hoy() : cr.fin); let f = cr.inicio; while (true) { w = semana(f); if (!weeks.includes(w)) weeks.push(w); if (w >= last) break; f = addDays(f, 7); if (weeks.length > 30) break; } }
  const top = people.slice(0, TOPN);
  charts.sem = new Chart($("#chSem"), {
    type: "line",
    data: { labels: weeks.map(semLabel), datasets: top.map((r, i) => { let acc = 0; return { label: r.nombre, data: weeks.map(w => (acc += (res.ps?.[r.id]?.[w] || 0))), borderColor: SERIES[i], backgroundColor: SERIES[i], borderWidth: 2, pointRadius: 3, pointHoverRadius: 5, tension: 0.2 }; }) },
    options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false }, scales: { x: { grid: { display: false }, ticks: tick, title: { display: true, text: "Semana que inicia" } }, y: { grid, ticks: tick, beginAtZero: true, title: { display: true, text: "Puntos acumulados" } } },
      plugins: { legend: { display: true, position: "bottom", labels: { boxWidth: 12, boxHeight: 12, usePointStyle: true } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${pts(c.raw)}` } } } }
  });
}

async function exportCSV(corteId, btn) {
  busy(btn, true, "Generando…");
  try {
    const s = await getDocs(query(collection(db, "registros"), where("corte", "==", corteId)));
    const rows = [["Fecha", "Participante", "Área", "Actividad", "Categoría", "Puntos", "Estado", "Revisado", "Origen", "Comentario", "Evidencias", "Moderado por", "Motivo"]];
    s.docs.map(d => d.data()).sort((a, b) => a.fecha.localeCompare(b.fecha)).forEach(r => {
      const p = S.parts[r.participanteId] || {}, a = S.acts[r.actividadId] || {};
      rows.push([r.fecha, p.nombre || r.participanteId, p.area || "", a.nombre || r.actividadId, a.categoria || "", String(r.puntos).replace(".", ","), r.estado === "rechazado" ? "Anulado" : "Sumado", r.revisado === false ? "No" : "Sí", r.origen === "historico" ? "Histórico Power Apps" : "App", r.comentario || "", (r.media || []).map(m => m.url).join(" "), r.moderadoPor || "", r.motivo || ""]);
    });
    const csv = "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = `saludable360_${corteId}.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { toast(errMsg(e), "bad"); }
  busy(btn, false);
}

// ---------- Moderación ----------
function admModeracion() {
  const box = $("#adm");
  if (!["sinrevisar", "rechazado"].includes(S.modFilter)) S.modFilter = "sinrevisar";
  box.innerHTML = `<div class="card"><div class="sectionTitle"><div class="chips">
      <button class="chip ${S.modFilter === "sinrevisar" ? "on" : ""}" data-f="sinrevisar">🆕 Sin revisar</button>
      <button class="chip ${S.modFilter === "rechazado" ? "on" : ""}" data-f="rechazado">✖ Anulados</button></div>
      <button class="btn ok sm hidden" id="apAll">✔ Marcar todos como revisados</button></div>
    <p class="muted" style="font-size:13px;margin-top:0">Los puntos se suman apenas la persona registra su actividad. Aquí revisas las evidencias nuevas: <b>✔ OK</b> la deja como está y <b>Anular</b> descuenta los puntos. Un registro anulado se puede restaurar.</p>
    <div id="modList"><div class="loading"><span class="spin"></span></div></div></div>`;
  $$("[data-f]", box).forEach(b => b.onclick = () => { S.modFilter = b.dataset.f; admModeracion(); });
  if (S.subs.mod) S.subs.mod();
  const q = S.modFilter === "sinrevisar" ? where("revisado", "==", false) : where("estado", "==", "rechazado");
  S.subs.mod = onSnapshot(query(collection(db, "registros"), q), s => {
    if (S.tab !== "admin" || S.adminSec !== "moderacion") { S.subs.mod(); S.subs.mod = null; return; }
    S.modList = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
    const list = S.modList;
    const apAll = $("#apAll"); apAll && apAll.classList.toggle("hidden", !(S.modFilter === "sinrevisar" && list.length > 1));
    $("#modList").innerHTML = list.length ? list.map(r => {
      const p = S.parts[r.participanteId] || {}, a = S.acts[r.actividadId] || {};
      return `<div class="modItem"><div class="mm">${(r.media || []).map(m => m.tipo === "video" ? `<video src="${esc(m.url)}" controls playsinline preload="none" poster="${esc(poster(m.url))}"></video>` : `<img src="${esc(cld(m.url, "w_400,c_limit,q_auto,f_auto"))}" data-full="${esc(m.url)}" alt="">`).join("") || `<div class="noMedia" style="margin:0">Sin evidencia</div>`}</div>
        <div><b>${esc(p.nombre || "")}</b> <small>· ${fFecha(r.fecha)}</small><br><span class="actTag" style="display:inline-block;margin:6px 0">${esc(a.nombre || "")}</span> <span class="ptsTag">+${fmt(r.puntos)} pts</span>
        ${r.comentario ? `<p style="margin:6px 0">${esc(r.comentario)}</p>` : ""}${r.motivo ? `<p class="muted" style="margin:6px 0">Motivo: ${esc(r.motivo)} (${esc(r.moderadoPor || "")})</p>` : ""}
        <div class="row" style="margin-top:8px">${r.estado === "aprobado" ? `<button class="btn ok sm" data-mod="aprobado" data-id="${r.id}">✔ OK</button><button class="btn bad sm" data-mod="rechazado" data-id="${r.id}">✖ Anular</button>` : `<button class="btn sm" data-mod="aprobado" data-id="${r.id}">↩ Restaurar (devolver puntos)</button>`}</div></div></div>`;
    }).join("") : `<div class="empty">${S.modFilter === "sinrevisar" ? "🎉 No hay evidencias nuevas por revisar." : "No hay registros anulados."}</div>`;
  }, e => { $("#modList").innerHTML = `<div class="err">${esc(errMsg(e))}</div>`; });
  box.onclick = async e => {
    const im = e.target.closest("img[data-full]"); if (im) return lightbox(im.dataset.full);
    const md = e.target.closest("[data-mod]"); if (md) return moderar(md.dataset.id, md.dataset.mod, md);
    if (e.target.id === "apAll") {
      const list = (S.modList || []).filter(r => r.estado === "aprobado" && r.revisado === false);
      if (!confirm(`¿Marcar las ${list.length} evidencias como revisadas? Revisa primero las fotos.`)) return;
      busy(e.target, true, "Guardando…");
      let ok = 0;
      for (let i = 0; i < list.length; i += 5) {
        try {
          const b = writeBatch(db); const pr = modProof(b);
          list.slice(i, i + 5).forEach(r => b.update(doc(db, "registros", r.id), { estado: "aprobado", revisado: true, moderadoPor: S.mod.nombre, moderadoEn: serverTimestamp(), motivo: "", _proof: pr }));
          await b.commit(); ok += Math.min(5, list.length - i);
        } catch (err) { modFail(err); break; }
      }
      toast(`${ok} evidencias revisadas`, "ok");
    }
  };
}

    <label class="fld"><span>Puntos</span><input type="number" id="aP" value="${a.puntos}" min="0" step="0.5"></label>
    <label class="fld"><span>Categoría</span><input type="text" id="aC" value="${esc(a.categoria)}" list="catDL" maxlength="60"><datalist id="catDL">${catList().map(c => `<option value="${esc(c)}">`).join("")}</datalist></label>
    <label class="fld"><span>Descripción (opcional)</span><textarea id="aD" maxlength="250">${esc(a.descripcion || "")}</textarea></label>
    <label class="row" style="margin-bottom:12px"><input type="checkbox" id="aAct" ${a.activa !== false ? "checked" : ""}> Activa (visible para registrar)</label>
    <div class="err" id="aErr"></div><button class="btn primary block" id="aSave">Guardar</button>`);
  $("#aSave", m.el).onclick = async () => {
    const nombre = $("#aN", m.el).value.trim(), puntos = parseFloat($("#aP", m.el).value), categoria = $("#aC", m.el).value.trim(), descripcion = $("#aD", m.el).value.trim(), activa = $("#aAct", m.el).checked;
    if (!nombre || !categoria || !(puntos >= 0)) { $("#aErr", m.el).textContent = "Completa nombre, puntos y categoría."; return; }
    const btn = $("#aSave", m.el); busy(btn, true, "Guardando…");
    try {
      const b = writeBatch(db); const pr = modProof(b);
      const data = { nombre, puntos, categoria, descripcion, activa, _proof: pr };
      if (id) b.update(doc(db, "actividades", id), data);
      else b.set(doc(db, "actividades", newId("actividades")), { ...data, orden: Math.max(0, ...actList().map(x => x.orden || 0)) + 1 });
      await b.commit(); m.close(); toast("Guardado", "ok");
    } catch (e) { busy(btn, false); $("#aErr", m.el).textContent = errMsg(e); }
  };
}

// ---------- Moderadores ----------
function admModeradores() {
  const list = Object.values(S.mods).sort((a, b) => a.nombre.localeCompare(b.nombre));
  $("#adm").innerHTML = `<div class="card"><div class="sectionTitle"><h3 style="margin:0">Moderadores y administradores</h3><button class="btn primary sm" id="addM">➕ Agregar</button></div>
    <p class="muted" style="font-size:13px;margin-top:0"><b>Moderador:</b> aprueba/rechaza evidencias y restablece PIN. <b>Administrador:</b> además gestiona participantes, actividades, cortes y moderadores.</p>
    <div class="tblWrap"><table class="tbl"><thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>
    ${list.map(m => `<tr style="${m.activo === false ? "opacity:.55" : ""}"><td><b>${esc(m.nombre)}</b>${m.id === S.mod.id ? " <small>(tú)</small>" : ""}</td><td>${m.rol === "admin" ? "Administrador" : "Moderador"}</td><td>${m.activo === false ? `<span class="badge">Inactivo</span>` : `<span class="badge ok">Activo</span>`}</td><td style="text-align:right"><button class="btn sm" data-em="${m.id}">Editar</button></td></tr>`).join("")}
    </tbody></table></div></div>`;
  $("#adm").onclick = e => { if (e.target.id === "addM") return editMod(null); const b = e.target.closest("[data-em]"); if (b) editMod(b.dataset.em); };
}
function editMod(id) {
  const md = id ? S.mods[id] : { nombre: "", rol: "mod", activo: true };
  const self = id === S.mod.id;
  const m = openModal(`<h3>${id ? "Editar" : "Nuevo"} moderador</h3>
    <label class="fld"><span>Nombre</span><input type="text" id="mN" value="${esc(md.nombre)}" maxlength="60"></label>
    <label class="fld"><span>Rol</span><select id="mR" ${self ? "disabled" : ""}><option value="mod" ${md.rol !== "admin" ? "selected" : ""}>Moderador</option><option value="admin" ${md.rol === "admin" ? "selected" : ""}>Administrador</option></select></label>
    <label class="fld"><span>${id ? "Nuevo PIN (déjalo vacío para no cambiarlo)" : "PIN (4 a 8 números; recomendado 6)"}</span><input type="password" inputmode="numeric" maxlength="8" class="pin" id="mP" autocomplete="new-password"></label>
    ${id && !self ? `<label class="row" style="margin-bottom:12px"><input type="checkbox" id="mA" ${md.activo !== false ? "checked" : ""}> Activo</label>` : ""}
    <div class="err" id="mE"></div><button class="btn primary block" id="mS">Guardar</button>`);
  $("#mS", m.el).onclick = async () => {
    const nombre = $("#mN", m.el).value.trim(), rol = self ? "admin" : $("#mR", m.el).value, pin = $("#mP", m.el).value.trim();
    const activo = id && !self ? $("#mA", m.el).checked : true;
    if (nombre.length < 2) { $("#mE", m.el).textContent = "Escribe el nombre."; return; }
    if ((!id || pin) && !pinOk(pin, 4, 8)) { $("#mE", m.el).textContent = "El PIN debe tener de 4 a 8 números."; return; }
    const btn = $("#mS", m.el); busy(btn, true, "Guardando…");
    try {
      const mid = id || newId("mods");
      const b = writeBatch(db); const pr = modProof(b);
      b.set(doc(db, "mods", mid), { nombre, rol, activo, _proof: pr }, { merge: true });
      const mp = { rol, activo, _proof: pr };
      if (pin) mp.h = await hMod(mid, pin);
      b.set(doc(db, "modpins", mid), mp, { merge: true });
      await b.commit();
      if (self && pin) { S.mod.h = mp.h; sessionStorage.setItem("s360_mod", JSON.stringify(S.mod)); }
      if (self) { S.mod.nombre = nombre; sessionStorage.setItem("s360_mod", JSON.stringify(S.mod)); }
      m.close(); toast("Guardado", "ok");
    } catch (e) { busy(btn, false); $("#mE", m.el).textContent = errMsg(e); }
  };
}

// ---------- Configuración ----------
function admConfig() {
  const cfg = S.cfg, cs = cortes();
  $("#adm").innerHTML = `<div class="grid2"><div class="card"><h3>General y Cloudinary</h3>
      <label class="fld"><span>Nombre del programa</span><input type="text" id="cN" value="${esc(cfg.nombre || "")}"></label>
      <label class="fld"><span>Cloudinary · Cloud name</span><input type="text" id="cC" value="${esc(cfg.cloudName || "")}" placeholder="ej: dxyz123ab" autocomplete="off"></label>
      <label class="fld"><span>Cloudinary · Upload preset (Unsigned)</span><input type="text" id="cP" value="${esc(cfg.preset || "")}" placeholder="saludable360" autocomplete="off"></label>
      <div class="err" id="cE"></div><button class="btn primary" id="cS">Guardar</button></div>
    <div class="card"><div class="sectionTitle"><h3 style="margin:0">Cortes (trimestres)</h3><button class="btn sm" id="addC">➕ Agregar siguiente corte</button></div>
      <p class="muted" style="font-size:13px;margin-top:0">Cada registro se asigna al corte según su fecha. El ranking se reinicia en cada corte y el historial se conserva.</p>
      <div class="tblWrap"><table class="tbl"><thead><tr><th>Nombre</th><th>Inicio</th><th>Fin</th><th></th></tr></thead><tbody id="cRows">
      ${cs.map((c, i) => `<tr data-i="${i}"><td><input type="text" value="${esc(c.nombre)}" data-k="nombre"></td><td><input type="date" value="${c.inicio}" data-k="inicio"></td><td><input type="date" value="${c.fin}" data-k="fin"></td><td><small>${esc(c.id)}</small></td></tr>`).join("")}
      </tbody></table></div><div class="err" id="kE"></div><button class="btn primary" id="kS" style="margin-top:8px">Guardar cortes</button></div></div>`;
  const save = async (data, btn, errEl) => {
    busy(btn, true, "Guardando…");
    try { const b = writeBatch(db); const pr = modProof(b); b.update(doc(db, "config", "app"), { ...data, _proof: pr }); await b.commit(); toast("Guardado", "ok"); busy(btn, false); return true; }
    catch (e) { busy(btn, false); errEl.textContent = errMsg(e); return false; }
  };
  $("#cS").onclick = () => save({ nombre: $("#cN").value.trim() || "Huntsman Saludable 360", cloudName: $("#cC").value.trim(), preset: $("#cP").value.trim() }, $("#cS"), $("#cE"));
  const readRows = () => $$("#cRows tr").map(tr => { const c = { ...cs[+tr.dataset.i] }; $$("input", tr).forEach(i => c[i.dataset.k] = i.value); return c; });
  const valid = list => { const s = list.slice().sort((a, b) => a.inicio.localeCompare(b.inicio)); for (let i = 0; i < s.length; i++) { if (!s[i].inicio || !s[i].fin || s[i].fin < s[i].inicio) return `Fechas inválidas en "${s[i].nombre}".`; if (i && s[i].inicio <= s[i - 1].fin) return `"${s[i].nombre}" se cruza con "${s[i - 1].nombre}".`; } return ""; };
  $("#kS").onclick = () => { const l = readRows(); const v = valid(l); if (v) { $("#kE").textContent = v; return; } save({ cortes: l }, $("#kS"), $("#kE")); };
  $("#addC").onclick = () => {
    const l = readRows(); const last = l.sort((a, b) => a.inicio.localeCompare(b.inicio))[l.length - 1];
    const ini = addDays(last.fin, 1); const d = new Date(ini + "T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() + 3); d.setUTCDate(0);
    const fin = d.toISOString().slice(0, 10);
    const [y, mo] = ini.split("-"); const q = Math.floor((+mo - 1) / 3) + 1;
    const mNom = f => MES[+f.split("-")[1] - 1]; const cap = s => s[0].toUpperCase() + s.slice(1);
    let nid = `${y}-Q${q}`; while (l.some(c => c.id === nid)) nid += "b";
    l.push({ id: nid, nombre: `${cap(mNom(ini))} ${ini.slice(0, 4)} – ${cap(mNom(fin))} ${fin.slice(0, 4)}`, inicio: ini, fin });
    save({ cortes: l }, $("#addC"), $("#kE"));
  };
}

// ---------- Herramientas ----------
function admHerramientas() {
  const isA = S.mod.rol === "admin";
  const seedPending = isA && SEED && !S.cfg.importado;
  $("#adm").innerHTML = `
    ${seedPending ? `<div class="card" style="border-color:#bfe3de"><h3>📥 Importar historial de Power Apps</h3>
      <p>Carga ${SEED.participantes.length} participantes, ${SEED.actividades.length} actividades y ${SEED.registros.length} registros aprobados (ago–sep 2026). Solo se hace una vez.</p>
      <div class="progress hidden" id="impProg"><div></div></div><div class="err" id="impErr"></div>
      <button class="btn primary" id="imp">Importar ahora</button></div>` : ""}
    <div class="card"><h3>⬇️ Exportar a Excel</h3><p class="muted">Descarga todos los registros del corte seleccionado (CSV, se abre en Excel).</p><div class="row">${corteSelect()}<button class="btn" id="exp">Descargar CSV</button></div></div>`;
  bindCorteSelect();
  $("#exp").onclick = () => exportCSV(S.corteSel, $("#exp"));
  if (seedPending) $("#imp").onclick = () => importarSeed($("#imp"), $("#impProg"), $("#impErr"));

async function importarSeed(btn, prog, errEl) {
  if (!confirm("¿Importar el historial de Power Apps ahora?")) return;
  busy(btn, true, "Importando…"); prog.classList.remove("hidden");
  const bar = $("div", prog);
  const writes = [];
  SEED.actividades.forEach(a => writes.push([doc(db, "actividades", a.id), { nombre: a.nombre, puntos: a.puntos, categoria: a.categoria, descripcion: a.descripcion || "", activa: true, orden: a.orden }]));
  SEED.participantes.forEach(p => writes.push([doc(db, "participantes", p.id), { nombre: p.nombre, area: "", activo: true, pinSet: false, creado: serverTimestamp() }]));
  const cortesUsados = new Set();
  SEED.registros.forEach(r => {
    const c = corteDe(r.f) || cortes()[0]; cortesUsados.add(c.id);
    writes.push([doc(collection(db, "registros")), {
      participanteId: r.p, actividadId: r.a, puntos: r.pts, fecha: r.f, corte: c.id, comentario: r.c || "", media: [],
      estado: "aprobado", revisado: true, origen: "historico", likes: {}, nCom: 0, sinFecha: !!r.sf,
      creado: Timestamp.fromDate(new Date(r.f + "T12:00:00-05:00")), moderadoPor: "Importación Power Apps"
    }]);
  });
  const chunks = []; for (let i = 0; i < writes.length; i += 5) chunks.push(writes.slice(i, i + 5));
  let done = 0;
  try {
    // actividades y participantes primero (en orden), luego registros en paralelo de a 4 lotes
    const firstN = Math.ceil((SEED.actividades.length + SEED.participantes.length) / 5);
    const run = async ch => { const b = writeBatch(db); const pr = modProof(b); ch.forEach(([ref, data]) => b.set(ref, { ...data, _proof: pr })); await b.commit(); done++; bar.style.width = Math.round(done / chunks.length * 95) + "%"; };
    for (let i = 0; i < firstN; i++) await run(chunks[i]);
    const rest = chunks.slice(firstN);
    for (let i = 0; i < rest.length; i += 4) await Promise.all(rest.slice(i, i + 4).map(run));
    const b = writeBatch(db); const pr = modProof(b); b.update(doc(db, "config", "app"), { importado: true, _proof: pr }); await b.commit();
    bar.style.width = "100%";
    toast("¡Historial importado! ✔", "ok");
    F.first = []; F.more = []; F.cursor = null; F.end = false;
    route();
  } catch (e) {
    busy(btn, false); errEl.textContent = "Error en la importación: " + errMsg(e) + ` (${done}/${chunks.length} lotes). Si se repite, avísame antes de reintentar para evitar duplicados.`;
    console.error(e);
  }
}

      S.setupMode = false; S.adminSec = "herramientas";
      toast("¡Configuración creada! Ahora importa el historial.", "ok");

  };
}
